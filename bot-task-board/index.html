<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="任務總表">
  <meta name="description" content="Bot 團隊任務狀態一覽：進行中、待決定、待辦與例行工作。">
  <title>Bot 任務總表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F1EA;
      --bg-2: #EFE8DE;
      --card: #FFFCFA;
      --ink: #2A2623;
      --muted: #8B837A;
      --line: #E6DFD4;
      --rose: #B5645C;
      --doing: #5F7D66;
      --doing-bg: #E5EFE7;
      --wait: #A67B3D;
      --wait-bg: #F4EBD8;
      --todo: #6B728C;
      --todo-bg: #E8EAF2;
      --idle: #8B837A;
      --idle-bg: #EFEBE6;
      --shadow: 0 8px 24px rgba(42, 38, 35, 0.05);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100dvh;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px calc(48px + var(--safe-bottom)); }
    header.hero {
      padding: calc(28px + var(--safe-top)) 0 8px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    h1 {
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-weight: 600;
      font-size: clamp(28px, 7vw, 40px);
      letter-spacing: 0.04em;
      line-height: 1.25;
      margin: 0 0 8px;
    }
    .lede { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .counts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .count {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 8px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .count b {
      display: block;
      font-family: "Noto Serif TC", serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.1;
    }
    .count span { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
    .count[data-status="進行中"] b { color: var(--doing); }
    .count[data-status="等主人決定"] b { color: var(--wait); }
    .count[data-status="待辦"] b { color: var(--todo); }
    .count[data-status="閒置"] b { color: var(--idle); }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 88%, white);
      backdrop-filter: blur(12px);
      padding: 10px 0 12px;
      margin: 0 -20px;
      padding-left: 20px;
      padding-right: 20px;
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 12px 16px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      outline: none;
    }
    .search:focus { border-color: #C9B8A4; }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 0 2px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 13px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: #FAF7F2;
      border-color: var(--ink);
    }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
    }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .bot-name {
      font-family: "Noto Serif TC", serif;
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .role { margin: 0; color: var(--muted); font-size: 13px; }
    .badge {
      flex: none;
      font-size: 11px;
      letter-spacing: 0.04em;
      border-radius: 999px;
      padding: 4px 9px;
      white-space: nowrap;
    }
    .badge.進行中 { background: var(--doing-bg); color: var(--doing); }
    .badge.等主人決定 { background: var(--wait-bg); color: var(--wait); }
    .badge.待辦 { background: var(--todo-bg); color: var(--todo); }
    .badge.閒置 { background: var(--idle-bg); color: var(--idle); }
    .section { margin-top: 14px; }
    .section h3 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      font-weight: 600;
    }
    .section ul { margin: 0; padding: 0 0 0 18px; }
    .section li { font-size: 14px; margin: 0 0 4px; }
    .routines { display: flex; flex-direction: column; gap: 6px; }
    .routine {
      background: var(--bg);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .routine b { font-weight: 600; }
    .routine span { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    footer a { color: inherit; }
    @media (max-width: 420px) {
      .counts { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <p class="eyebrow">Team Status</p>
      <h1>Bot 任務總表</h1>
      <p class="lede" id="lede">載入中…</p>
    </header>
    <div class="counts" id="counts" hidden></div>
    <div class="toolbar">
      <label class="sr-only" for="q" style="position:absolute;left:-9999px">搜尋</label>
      <input class="search" id="q" type="search" placeholder="搜尋 bot、職務或任務…" autocomplete="off">
      <div class="filters" id="filters" role="tablist" aria-label="依狀態篩選"></div>
    </div>
    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden>沒有符合的項目。</p>
    <footer>
      <p id="foot"></p>
      <p><a href="../index.html">回到樣品首頁</a></p>
    </footer>
  </div>
  <script>
    const STATUS = ["進行中", "等主人決定", "待辦", "閒置"];
    const state = { filter: "全部", q: "", data: null };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function haystack(bot) {
      const parts = [bot.name, bot.role, bot.status, ...(bot.inProgress || []), ...(bot.pending || [])];
      (bot.routines || []).forEach((r) => parts.push(r.name, r.schedule));
      return parts.join(" ").toLowerCase();
    }

    function render() {
      const data = state.data;
      const q = state.q.trim().toLowerCase();
      const bots = data.bots.filter((b) => {
        if (state.filter !== "全部" && b.status !== state.filter) return false;
        if (q && !haystack(b).includes(q)) return false;
        return true;
      });
      const order = { "進行中": 0, "等主人決定": 1, "待辦": 2, "閒置": 3 };
      bots.sort((a, b) => (order[a.status] - order[b.status]) || a.name.localeCompare(b.name, "zh-Hant"));

      $("list").innerHTML = bots.map((b) => {
        const ip = (b.inProgress || []).map((t) => `<li>${escapeHtml(t)}</li>`).join("");
        const pd = (b.pending || []).map((t) => `<li>${escapeHtml(t)}</li>`).join("");
        const rt = (b.routines || []).map((r) =>
          `<div class="routine"><b>${escapeHtml(r.name)}</b><br><span>${escapeHtml(r.schedule)}</span></div>`
        ).join("");
        return `<article class="card">
          <div class="card-top">
            <div>
              <h2 class="bot-name">${escapeHtml(b.name)}</h2>
              <p class="role">${escapeHtml(b.role)}</p>
            </div>
            <span class="badge ${escapeHtml(b.status)}">${escapeHtml(b.status)}</span>
          </div>
          ${ip ? `<div class="section"><h3>進行中</h3><ul>${ip}</ul></div>` : ""}
          ${pd ? `<div class="section"><h3>待辦</h3><ul>${pd}</ul></div>` : ""}
          ${rt ? `<div class="section"><h3>例行工作</h3><div class="routines">${rt}</div></div>` : ""}
          ${!ip && !pd && !rt ? `<div class="section"><p class="role">目前沒有進行中或待辦的項目。</p></div>` : ""}
        </article>`;
      }).join("");
      $("empty").hidden = bots.length > 0;
    }

    function setup(data) {
      state.data = data;
      const counts = Object.fromEntries(STATUS.map((s) => [s, 0]));
      data.bots.forEach((b) => { if (counts[b.status] != null) counts[b.status]++; });
      $("lede").textContent = `共 ${data.bots.length} 位 bot · 資料截至 ${data.asOf}（台北時間）`;
      $("counts").hidden = false;
      $("counts").innerHTML = STATUS.map((s) =>
        `<div class="count" data-status="${s}"><b>${counts[s]}</b><span>${s}</span></div>`
      ).join("");
      const filters = ["全部", ...STATUS];
      $("filters").innerHTML = filters.map((s) =>
        `<button type="button" class="chip" data-filter="${s}" aria-pressed="${s === state.filter}">${s}</button>`
      ).join("");
      $("filters").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-filter]");
        if (!btn) return;
        state.filter = btn.dataset.filter;
        $("filters").querySelectorAll("button").forEach((b) => {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        render();
      });
      $("q").addEventListener("input", () => { state.q = $("q").value; render(); });
      $("foot").textContent = data.note + " 狀態是依交接文字判斷的。";
      render();
    }

    fetch("data.json")
      .then((r) => { if (!r.ok) throw new Error("load"); return r.json(); })
      .then(setup)
      .catch(() => { $("lede").textContent = "資料載入失敗，請用本機或網站伺服器開啟這一頁。"; });
  </script>
</body>
</html>
